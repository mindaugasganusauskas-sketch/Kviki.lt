# Režimas serveriui, kuriame jau veikia nginx su kitomis svetainėmis.
# Kviki pasiekiamas tik serverio viduje (127.0.0.1), o domeną ir HTTPS aptarnauja esamas nginx.
# Įjungiamas .env faile: COMPOSE_FILE=docker-compose.yml:deploy/compose.nginx.yml
services:
  app:
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3000"
  caddy:
    profiles: ["caddy"]
